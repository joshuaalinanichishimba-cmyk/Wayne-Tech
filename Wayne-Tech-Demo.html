/* Demo entry and catalogue */
.home-mode #sidebar,.store-mode #sidebar{display:none}
.home-mode #topbar,.home-mode #main,.store-mode #topbar,.store-mode #main{margin-left:0}
.home-mode #topbar{padding-inline:max(20px,calc((100vw - 1150px)/2));gap:12px}
.home-mode #main{max-width:1200px;margin-inline:auto;padding-top:23px}
.store-mode #topbar{display:block;padding:0;position:relative}
.store-mode #main{max-width:none;margin:0;padding:0;background:#f4f8fa}
.shop-width{width:min(1180px,calc(100% - 48px));margin-inline:auto}
.store-brand{border:0;padding:0;background:none;color:var(--ink);text-align:left;cursor:pointer;gap:9px}
.store-brand strong{white-space:normal;line-height:1.15}
.shop-notice{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--nav);color:#d0e1e9;font-size:.77rem;padding:4px 10px}
.notice-link.btn{color:#92f5df;background:transparent;border:0;min-height:26px;text-decoration:underline;padding:3px;font-size:inherit}
.shop-header{display:grid;grid-template-columns:auto minmax(140px,1fr) auto;gap:21px;align-items:center;padding:13px 0}
.shop-header form{display:block}
.shop-header input{width:100%;background:#f4f7f9;border-radius:30px;padding-left:16px}
.shop-services{display:flex;align-items:center;justify-content:flex-end;gap:3px}
.shop-services .btn{padding:5px 8px}
.shop-services select{font-size:.82rem}
.shop-category-nav{display:flex;gap:24px;overflow:auto;scrollbar-width:thin}
.shop-category-nav button{padding:9px 2px 10px;border:0;border-bottom:3px solid transparent;white-space:nowrap;background:transparent;font-size:.87rem;font-weight:650;color:var(--muted)}
.shop-category-nav button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.shop-hero{background:#102c3c;background-image:radial-gradient(ellipse at 79% 0%,#126271 0%,transparent 68%);color:white;padding:43px 0}
.shop-hero-content{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px, .9fr);gap:56px;align-items:center}
.shop-pitch .eyebrow,.entry-hero .eyebrow{color:#80e9d6}
.shop-pitch h1,.entry-hero h1{font-size:clamp(2.65rem,5.4vw,5rem);line-height:.97;letter-spacing:-.067em;margin:12px 0 18px}
.shop-pitch p,.entry-hero p{font-size:1.05rem;color:#d3e1e9;max-width:455px}
.shop-pitch .actions{margin-top:20px;flex-wrap:wrap}
.shop-branches{margin-top:20px;font-size:.84rem;color:#b7d4df}
.trade-widget{background:white;color:var(--ink);padding:20px;border:1px solid #c8e0e5;border-radius:17px;display:grid;gap:11px;box-shadow:0 18px 34px #071b2b4a}
.trade-widget h2{font-size:1.27rem;margin-bottom:2px}
.trade-widget .field{font-size:.83rem}
.trade-widget select{font-size:.9rem;width:100%}
.estimate-result{background:#eff7f8;border-radius:10px;padding:8px;display:flex;align-items:center;gap:13px}
.estimate-result strong{display:block;color:#0a575e;line-height:1.16;font-size:1.35rem;letter-spacing:-.035em}
.estimate-result small{display:block;font-size:.77rem}
.estimate-photo{width:67px;height:67px;object-fit:contain;background:white;border-radius:8px}
.shop-content{padding:27px 0 32px}
.shop-categories{margin-bottom:24px}
.shop-categories h2,#product-list h2{font-size:1.4rem;margin-bottom:12px}
.category-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.category-grid button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;padding:7px;color:var(--ink)}
.category-grid button:hover,.category-grid button[aria-pressed=true]{border-color:var(--accent);background:#edf9f7}
.category-grid small{display:block;color:var(--muted);line-height:1.2;margin-top:2px;font-size:.72rem}
.category-photo{width:40px;height:40px;object-fit:contain;border-radius:5px;background:white}
.catalogue-group{margin-bottom:24px}
.shop-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.product{padding:0;overflow:hidden;min-width:0}
.product-art,.store-mode .product-art{width:100%;height:auto;aspect-ratio:1.25;background:#fff;display:block;position:relative;overflow:hidden;padding:9px;border:0;border-radius:0;border-bottom:1px solid #eaf0f3}
.product-art:before{content:none}
.product-art img{display:block;height:100%;width:100%;object-fit:contain;transition:transform .22s}
button.product-art:hover img{transform:scale(1.05)}
.product-copy{padding:10px 12px 13px}
.product h3{margin:0 0 3px}
.product .row{margin-top:9px}
.price-row strong{font-size:1.1rem}
.product-thumb{height:43px;width:43px;display:block;object-fit:contain;border-radius:6px;border:1px solid #edf1f4;background:white;flex:none}
.cart .row.cart-label{justify-content:flex-start;border:none;padding-bottom:0}
.detail-product{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,1.15fr);align-items:center;gap:13px}
.detail-product img{display:block;width:100%;max-height:230px;object-fit:contain;border:1px solid var(--line);border-radius:9px}
.shop-footer{border-top:1px solid var(--line);padding:17px 0 0;margin-top:27px;display:flex;gap:15px;align-items:center;justify-content:space-between}
.shop-footer .actions{flex-wrap:wrap}
.entry-hero{border-radius:19px;padding:30px 27% 32px 35px;background:linear-gradient(110deg,#122d42,#0a5860);color:#fff;position:relative;overflow:hidden}
.entry-hero h1{font-size:clamp(2.5rem,5.5vw,4.2rem)}
.entry-preview{display:flex;position:absolute;right:5%;bottom:10%;width:31%;height:54%;align-items:center;transform:rotate(-6deg)}
.entry-preview img{min-width:0;width:35%;aspect-ratio:1;object-fit:contain;background:white;padding:5px;border-radius:11px;box-shadow:0 6px 13px #08263058}
.entry-preview img:nth-child(2){transform:translate(-8%,16%) rotate(12deg)}
.entry-preview img:nth-child(3){transform:translate(-12%,-12%) rotate(-2deg)}
.entry-options{margin-top:15px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:15px}
.entry-options .pad{padding:18px}
.entry-options h2{margin:8px 0 4px}
.entry-roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:14px}
.entry-roles button{border:1px solid var(--line);border-radius:8px;background:#f7fafb;text-align:left;padding:8px 10px;color:var(--ink)}
.entry-roles button:hover{border-color:var(--accent);background:#e9f7f5}
.entry-roles small{display:block;color:var(--muted);font-size:.75rem}
.entry-actions{margin-top:12px;flex-wrap:wrap}
.entry-shop-photo{text-align:center;margin-top:12px}
.entry-shop-photo img{width:120px;height:110px;object-fit:contain}
@media(max-width:950px){.shop-header{gap:11px}.shop-hero-content{gap:28px}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:740px){.shop-width{width:calc(100% - 28px)}.shop-header{grid-template-columns:1fr 1fr;gap:8px;padding:9px 0}.shop-header form{grid-row:2;grid-column:1/-1}.shop-services{justify-content:end}.shop-services .btn{padding:4px;font-size:.79rem}.shop-header .store-brand strong{display:inline}.shop-header .store-brand img{width:30px;height:30px}.shop-category-nav{gap:17px}.shop-hero{padding:24px 0}.shop-hero-content,.entry-options{grid-template-columns:1fr;gap:13px}.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.entry-hero{padding:22px 16px}.entry-preview{display:none}.shop-footer{align-items:flex-start;flex-direction:column}}

.invoice-panel{margin:14px 0}
.invoice-filters,.invoice-counts{display:grid;gap:10px;margin:12px 0}
.invoice-filters{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.invoice-counts{grid-template-columns:repeat(3,minmax(0,1fr))}
.invoice-counts>div{background:#f4f8f9;border:1px solid var(--line);border-radius:9px;padding:8px 11px;display:grid;gap:3px}
.invoice-counts strong{font-size:1.3rem}
.invoice-status{padding:9px 0;border-top:1px solid var(--line);margin-top:10px}
.invoice-status-row,.invoice-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.invoice-status-row{justify-content:space-between}
.invoice-status .actions{flex-wrap:wrap}
#invoice-controls{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:8px}
.retail-print-sheet{display:none}
@media print{
 body.retail-printing{background:white!important}
 body.retail-printing>:not(dialog):not(.retail-print-sheet){display:none!important}
 body.retail-printing dialog{position:static;width:auto;height:auto;max-width:none;max-height:none;border:0;box-shadow:none;overflow:visible;padding:0;margin:0}
 body.retail-printing dialog::backdrop{background:white}
 body.retail-printing dialog>*:not(.retail-print-sheet){display:none!important}
 body.retail-printing .retail-print-sheet{display:block;padding:10mm;color:#111;background:white;font:11pt/1.4 system-ui}
 body.retail-printing .retail-print-sheet p{margin:0 0 2mm}
 body.retail-printing .retail-print-sheet h1{font-size:16pt;margin:0 0 4mm}
}

function decision(id,reply=false){
 form(reply?'Respond to clarification':'Review request',(reply?'':select('Decision','state',opts(['Approve','Reject','Request clarification'])))+note('Review note','reason'),'Save decision',x=>{

 if(r.type==='Till handover'){const s=ops().shifts.find(s=>s.id===d.shift);if(s.diff)postOps(r.id,r.branch,today(),r.reason,[['Cash',s.diff],['Till variance',-s.diff]]);s.state='Closed';s.closedBy=actor()}
 if(r.type==='Stocktake'){const p=product(d.product),before=p.stock[r.branch];if(JSON.stringify(before)!==d.snapshot)return 'Stock changed. Reject this count and recount.';

async function digest(value,salt){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',iterations:100000,hash:'SHA-256',salt:new TextEncoder().encode(salt)},k,256);
 return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
}

 }
 for(const p of db.plans)p.payments.forEach((x,i)=>{const id=p.id+'/'+(i+1);post(x.date,p.branch,id,x.method,x.amount);post(x.date,p.branch,id,'Customer deposits',-x.amount)});

 }

 const cash=kind==='Cash book',wallet=kind==='Bank and wallet book',running=cash||wallet;
 const include=r=>cash?r.account==='Cash':wallet?(r.account===account):kind==='Sales day book'?r.account==='Sales':!account||r.account===account;
 const head=['Date','Shop','Reference','Account','Debit','Credit',...(running?['Balance']:[])];
 let value=balance(all.filter(r=>from&&r.date<from&&include(r)));
 const rows=running?[[from||'','', 'Opening balance',account||'Cash','','',value]]:[];

function effectivePayRule(list,date){
 return list.filter(rule=>rule.effective<=date).reverse().sort((a,b)=>b.effective.localeCompare(a.effective))[0];
}
function attachPayrollSale(sale,employee,data=payrollData()){
 if(!employee||sale.commission||!data.staff.some(person=>person.id===employee&&person.start<=sale.date))return;
 const policy=effectivePayRule(data.policies,sale.date);
 sale.commission={employee,policy:structuredClone(policy),lines:sale.lines.map((line,index)=>{
   const category=product(line.id)?.category;

 })};
}

 if(employee)attachPayrollSale(sale,employee,data);

function payTargets(sale,asOf,data){
 const c=sale.commission;
 if(!c?.policy?.enabled||sale.date>asOf)return [];
 return payCategories.flatMap(category=>{
   const rule=c.policy.categories[category],lines=c.lines.filter(line=>line.category===category);
   if(!rule||rule.mode==='None'||!lines.length)return [];
   const full=lines.reduce((n,l)=>n+l.units*l.unitValue,0);
   const returns=data.returns.filter(r=>r.saleId===sale.id&&r.date<=asOf&&lines.some(l=>l.index===r.lineIndex));
   const removed=returns.reduce((n,r)=>n+r.quantity*lines.find(l=>l.index===r.lineIndex).unitValue,0);
   const eligible=Math.max(0,full-removed);
   const target=rule.mode==='Fixed'?(full?Math.round(rule.rate*eligible/full):0):Math.round(eligible*rule.rate/10000);
   return [{key:sale.id+'|'+category,saleId:sale.id,employee:c.employee,branch:sale.branch,category,eligible,full,
     rule:rule.mode==='Fixed'?payMoney(rule.rate)+' fixed per category, prorated by retained value':rule.rate/100+'% of retained value',
     amount:target,returnRefs:returns.map(r=>r.id),policy:c.policy.id}];
 });
}
function payCommissions(run,data){
 const settled=new Map();
 for(const prior of data.runs){
   if(prior.id===run.id||prior.status==='Draft')continue;
   for(const row of prior.rows)for(const c of row.commissions)settled.set(c.key,(settled.get(c.key)||0)+c.amount);
 }
 return db.sales.flatMap(sale=>payTargets(sale,run.end,data)).flatMap(target=>{
   const previous=settled.get(target.key)||0;
   const amount=target.amount-previous;
   return amount?[{...target,amount,previous,target:target.amount}]:[];
 });
}
function payrollBandTax(base,bands,factor){
 let previous=0,tax=0;
 for(const [ceiling,rate] of bands){
   const level=ceiling===null?base:Math.round(ceiling*factor);
   tax+=Math.max(0,Math.min(base,level)-previous)*rate/10000;
   previous=level;
 }
 return Math.round(tax);
}
function calculatePay(person,run,inputs,commissions,rule,{commissionOnly=false}={}){
 const branchesPay=branches.map((_,b)=>({branch:b,hours:0,otHours:0,leave:0,...Object.fromEntries(payFields.map(k=>[k,0]))}));
 const home=person.branch;
 const factor=run.frequency==='Weekly'?12/52:1;
 const standard=rule.standardHours*factor;
 const hourRate=person.type==='Hourly'?person.rate:person.rate/standard;
 for(const input of inputs){
   const row=branchesPay[input.branch];
   switch(input.type){
     case 'Shift':row.hours+=input.value;break;
     case 'Overtime':row.otHours+=input.value;break;
     case 'Unpaid leave':row.leave+=input.value;break;
     case 'Bonus':row.bonus+=input.value;break;
     case 'Advance repayment':row.advance+=input.value;break;
     case 'Earnings adjustment':row.adjustment+=input.value;break;
     case 'Deduction adjustment':row.deduction+=input.value;break;
   }
 }
 const hours=paySum(branchesPay,'hours');
 const allocate=(value,weights,field)=>{
   const total=weights[0]+weights[1];
   const first=total?Math.round(value*weights[0]/total):home===0?value:0;
   branchesPay[0][field]+=first;branchesPay[1][field]+=value-first;
 };
 if(!commissionOnly){
   const ratio=person.start>run.start?payDays(person.start,run.end)/payDays(run.start,run.end):1;
   if(person.type==='Salaried')allocate(Math.round(person.rate*ratio),branchesPay.map(r=>r.hours),'basic');
   allocate(Math.round(person.allowance*ratio),branchesPay.map(r=>r.hours),'allowances');
   for(const row of branchesPay){
     if(person.type==='Hourly')row.basic=Math.round(row.hours*person.rate);
     row.overtime=Math.round(row.otHours*hourRate*rule.overtime/100);
   }
   if(person.type==='Salaried'){
     // Reduce basic wages for unpaid leave and allocate it by approved shift weight.
     const leave=Math.min(paySum(branchesPay,'basic'),Math.round(paySum(branchesPay,'leave')*hourRate));
     allocate(-leave,branchesPay.map(r=>r.hours),'basic');
   }
 }
 for(const c of commissions)branchesPay[c.branch].commission+=c.amount;
 for(const row of branchesPay)row.gross=row.basic+row.overtime+row.allowances+row.bonus+row.adjustment+row.commission;
 const gross=paySum(branchesPay,'gross'),basic=paySum(branchesPay,'basic');
 const basis=(key,ceiling=0)=>Math.max(0,Math.min(key==='Basic'?basic:gross,ceiling?Math.round(ceiling*factor):Infinity));
 const weights=branchesPay.map(row=>Math.max(0,row.gross));
 const contributions={
   paye:payrollBandTax(basis(rule.payeBasis),rule.bands,factor),
   napsa:Math.round(basis(rule.napsaBasis,rule.napsaCeiling)*rule.napsaEmployee/10000),
   nhima:Math.round(basis(rule.nhimaBasis,rule.nhimaCeiling)*rule.nhimaEmployee/10000),
   employerNapsa:Math.round(basis(rule.napsaBasis,rule.napsaCeiling)*rule.napsaEmployer/10000),
   employerNhima:Math.round(basis(rule.nhimaBasis,rule.nhimaCeiling)*rule.nhimaEmployer/10000),
   levy:Math.round(basis(rule.levyBasis,rule.levyCeiling)*rule.levy/10000)
 };
 for(const [k,n] of Object.entries(contributions))allocate(n,weights,k);
 for(const row of branchesPay){
   row.deductions=row.paye+row.napsa+row.nhima+row.advance+row.deduction;
   row.net=row.gross-row.deductions;
   row.employer=row.employerNapsa+row.employerNhima+row.levy;
   row.cost=row.gross+row.employer;
 }
 return {id:person.id,name:person.name,job:person.job,branch:home,hours,inputs:structuredClone(inputs),commissions,
   branches:branchesPay,...Object.fromEntries(payFields.map(k=>[k,paySum(branchesPay,k)]))};
}

function createPayRun(){
 if(!payCanManage())return;
 form('New regular pay run',select('Payroll group','frequency',opts(['Monthly','Weekly']))+
   field('Date within the pay period','date',`type="date" value="${today()}" required`),'Create draft',x=>{
   if(!payCanManage())return 'Payroll access is required.';
   if(!['Monthly','Weekly'].includes(x.frequency)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.date))return 'Select a valid pay group and date.';
   const data=payrollData(), period=payPeriod(x.date,x.frequency);
   if(data.runs.some(r=>r.kind==='Regular'&&r.start===period.start&&r.frequency===x.frequency))return 'A regular run already exists for this pay group and period.';
   if(data.runs.some(r=>r.kind==='Regular'&&r.frequency===x.frequency&&r.status!=='Draft'&&r.start>period.start))return 'Use an open period after the last approved run.';
   if(!effectivePayRule(data.rules,period.end))return 'No payroll rule is effective for this period.';
   const run={id:ref('PAY'),...period,frequency:x.frequency,kind:'Regular',status:'Draft'};
   data.runs.push(run);selectedPayRun=run.id;payTab='register';done('Payroll draft created · '+run.id);
 });
}

function payInput(id){

 const date=today()<run.start?run.start:today()>run.end?run.end:today();
 form('Record an approved payroll input',select('Employee','employee',opts(staff.map(p=>[p.id,p.name+' · '+p.job])))+

   field('Input date','date',`type="date" min="${run.start}" max="${run.end}" value="${date}" required`)+
   field('Hours or amount (ZMW)','value','type="number" step=".01" required')+
   note('Approval note or adjustment reason','reason'),'Save approved input',x=>{
     if(!payCanManage())return 'Payroll access is required.';
     const current=payrollData(), period=current.runs.find(r=>r.id===id), person=current.staff.find(p=>p.id===x.employee);
     if(period?.status!=='Draft')return 'Approved periods are locked. Add the correction to a later draft.';
     if(!person||person.frequency!==period.frequency||x.date<period.start||x.date>period.end||x.date<person.start)return 'Choose an employee and date within this open pay period.';
     const n=Number(x.value), isHours=payTypes.indexOf(x.type)<3,signed=x.type.endsWith('adjustment');
     if(!n||!coin(Math.abs(n))||(!signed&&n<0)||(isHours&&n>payDays(period.start,period.end)*24))return 'Enter a valid amount or number of hours for this entry.';
     const entry={id:ref('PI'),employee:x.employee,branch:Number(x.branch),type:x.type,value:isHours?n:payCents(n),date:x.date,reason:val(x,'reason')};
     current.inputs.unshift(entry);done(entry.id+' · '+entry.type+' · '+entry.reason,entry.branch);

function payApprove(id){
 if(!payCanManage()||role!=='Owner')return;
 const run=payrollData().runs.find(r=>r.id===id);
 if(!run||run.status!=='Draft')return;
 form('Approve payroll and post accrual',`<p>Approve <strong>${esc(payRunTitle(run))}</strong> for both branches. The employee amounts and rule version will be locked.</p>`,'Approve payroll',()=>{
   if(!payCanManage()||role!=='Owner')return 'Only the owner can approve a pay run.';
   const data=payrollData(),current=data.runs.find(r=>r.id===id);
   if(!current||current.status!=='Draft')return 'This run has already been approved.';
   if(data.runs.some(r=>r.kind==='Regular'&&r.id!==current.id&&r.frequency===current.frequency&&r.status==='Draft'&&r.start<current.start))return 'Approve the earlier draft for this payroll group first.';
   const rows=draftPayRows(current,data);
   if(!rows.length)return 'There are no employees in this pay group.';
   if(rows.some(row=>row.gross<0||row.net<0||row.deductions<0))return 'Resolve negative gross pay, deductions or take-home pay before approval.';
   if(rows.some(row=>data.runs.some(r=>r.kind==='Regular'&&r.id!==id&&r.status!=='Draft'&&r.start<=current.end&&r.end>=current.start&&r.rows.some(old=>old.id===row.id))))return 'An employee already has approved pay in an overlapping regular period.';
   current.rows=structuredClone(rows);
   current.rules=structuredClone(effectivePayRule(data.rules,current.end));
   current.approvedAt=today();current.payments={};
   current.status=rows.some(r=>r.net>0)?'Approved':'Paid';
   data.journals.push(approvalJournal(current));
   selectedPayRun=id;
   done('Approved payroll and posted one accrual · '+id);
 });
}
function payRecord(param){
 if(!payCanManage()||role!=='Finance')return;
 const [runId,employee]=param.split('|'),run=payrollData().runs.find(r=>r.id===runId);
 const row=run?.rows?.find(r=>r.id===employee);
 if(!row||run.status!=='Approved'||row.net<=0||payPayment(run,row).state==='Paid')return;
 form('Record simulated salary payment',`<p>${esc(row.name)} · ${payMoney(row.net)}</p>`+
   select('Simulated outcome','outcome',opts(['Paid','Failed']))+
   field('Payment date','date',`type="date" min="${run.approvedAt}" max="${today()}" value="${today()}" required`)+
   field('Payment reference','reference','required maxlength="75" placeholder="SIM-SALARY-001"'),'Save simulated result',x=>{
     if(!payCanManage()||role!=='Finance')return 'Finance access is required to record salary payments.';
     const data=payrollData(),current=data.runs.find(r=>r.id===runId),staff=current?.rows?.find(r=>r.id===employee);
     if(!staff||current.status!=='Approved'||payPayment(current,staff).state==='Paid')return 'This payment is already settled.';
     if(x.date<current.approvedAt||x.date>today())return 'Choose a date from approval through today.';
     const reference=val(x,'reference');
     if(data.runs.some(r=>Object.values(r.payments??{}).some(p=>p.state==='Paid'&&p.reference.toLowerCase()===reference.toLowerCase())))return 'That payment reference already belongs to a paid salary.';
     const previous=current.payments[employee];
     if(previous?.state===x.outcome&&previous.reference===reference&&previous.date===x.date)return 'This payment result was already recorded.';
     const settlement={state:x.outcome,date:x.date,reference,amount:x.outcome==='Paid'?staff.net:0};
     current.payments[employee]=settlement;
     if(x.outcome==='Paid'){
       data.journals.push(salaryJournal(current,staff,settlement));
       if(current.rows.every(r=>r.net===0||payPayment(current,r).state==='Paid'))current.status='Paid';
     }
     done('Simulated salary '+x.outcome.toLowerCase()+' · '+runId+' · '+employee+' · '+reference,staff.branch,()=>payDetails(param));
 });
}

function addPayRules(){
 if(!payCanManage()||role!=='Owner')return;
 const source=effectivePayRule(payrollData().rules,today());
 const basis=(title,key)=>select(title,key,opts(['Gross','Basic'],source[key]));
 const number=(title,key,divisor=100,max=100)=>field(title,key,`type="number" min="0" max="${max}" step=".01" value="${source[key]/divisor}" required`);
 const bands=source.bands.map(([limit,rate])=>(limit===null?'*':limit/100)+':'+rate/100).join(', ');
 form('Add a payroll rule version',`<p class="info-box">Demo rates. Verify statutory applicability, dates, rates and bases before using a live payroll.</p>`+
   field('Effective date','effective',`type="date" value="${today()}" required`)+
   basis('PAYE earnings basis','payeBasis')+field('PAYE bands (upper ZMW : rate %, * for last band)','bands',`required maxlength="300" value="${esc(bands)}"`)+
   basis('NAPSA earnings basis','napsaBasis')+'<div class="form-grid">'+number('NAPSA employee (%)','napsaEmployee')+number('NAPSA employer (%)','napsaEmployer')+'</div>'+
   number('NAPSA monthly earnings ceiling, zero for none (ZMW)','napsaCeiling',100,10000000)+
   basis('NHIMA earnings basis','nhimaBasis')+'<div class="form-grid">'+number('NHIMA employee (%)','nhimaEmployee')+number('NHIMA employer (%)','nhimaEmployer')+'</div>'+
   number('NHIMA monthly earnings ceiling, zero for none (ZMW)','nhimaCeiling',100,10000000)+
   basis('Skills levy earnings basis','levyBasis')+number('Skills Development Levy (%)','levy')+
   number('Skills levy monthly earnings ceiling, zero for none (ZMW)','levyCeiling',100,10000000)+
   '<div class="form-grid">'+number('Standard monthly hours','standardHours',1,744)+number('Overtime multiplier (%)','overtime',1,1000)+'</div>'+
   note('Rule change reason','reason'),'Save demo rule version',x=>{
     if(!payCanManage()||role!=='Owner')return 'Only the owner can change payroll rules.';
     const parsed=x.bands.split(',').map(s=>{
       const [limit,rate,extra]=s.split(':').map(v=>v.trim());
       if(!limit||!rate||extra!==undefined)return [NaN,NaN];
       return [limit==='*'?null:payCents(limit),payCents(rate)];
     });
     if(parsed.at(-1)?.[0]!==null||parsed.some(([max,rate],i)=>!Number.isSafeInteger(rate)||rate<0||rate>10000||
       (i<parsed.length-1&&(!Number.isSafeInteger(max)||max<=(parsed[i-1]?.[0]??0)))))return 'Enter ascending band ceilings, percentages from 0 to 100, and one final * band.';
     const rates=['napsaEmployee','napsaEmployer','nhimaEmployee','nhimaEmployer','levy'];
     if(rates.some(k=>!coin(Number(x[k]))||Number(x[k])>100)||Number(x.standardHours)<=0||Number(x.overtime)<0)return 'Enter valid rates, hours and multiplier.';
     const keys=[...rates,'napsaCeiling','nhimaCeiling','levyCeiling'];
     const rule={id:ref('STAT'),effective:x.effective,bands:parsed,payeBasis:x.payeBasis,napsaBasis:x.napsaBasis,nhimaBasis:x.nhimaBasis,levyBasis:x.levyBasis,
       standardHours:Number(x.standardHours),overtime:Number(x.overtime),...Object.fromEntries(keys.map(k=>[k,payCents(x[k])]))};
     payrollData().rules.push(rule);done('Payroll rules '+rule.id+' · '+val(x,'reason'));
 });
}

const badge=(s,kind='')=>`<span class="tag ${kind}">${esc(s)}</span>`;
const typeFor=s=>['Completed','Resolved','Ready','Approved','Paid'].includes(s)?'good':['Requested','Open','Active','Inspected','Reserved','In review'].includes(s)?'warn':s==='Cancelled'||s==='Declined'?'bad':'info';
const status=s=>badge(s,typeFor(s));
const cutoff=()=>isoDate(1-range);
const salesInRange=()=>db.sales.filter(s=>matchBranch(s)&&s.date>=cutoff()&&s.date<=today());
const sum=(xs,k)=>round(xs.reduce((n,x)=>n+x[k],0));
const profit=s=>round(s.total-s.lines.reduce((n,l)=>n+l.cost*l.units,0));
const pendingOrders=()=>db.orders.filter(o=>matchBranch(o)&&orderStages[o.stage]);
const pendingCases=()=>db.cases.filter(t=>matchBranch(t)&&ticketStages[t.stage]);
const lowStock=()=>db.products.filter(p=>branch==='all'?branches.some((_,b)=>count(p,b)<=2):available(p)<=2);
function refresh(){db=read(db)}
// This adapter is deliberately local. A future approved VSDC adapter belongs on
// the server, with a durable queue and the sale ID as its idempotency key.
const demoInvoiceAdapter = Object.freeze({
 submit(invoice) {
   return invoice.fail ? {status:'Failed', error:'Simulated submission interruption.'}
     : {status:'Issued', issuedAt:new Date().toISOString(), error:''};
 }
});
const invoiceStates=['Pending','Issued','Failed'];
const defaultInvoiceSettings=Object.freeze({rate:1600,failNext:false});
const invoiceDelay=1400;
const invoiceSettings=()=>db.invoiceSettings??defaultInvoiceSettings;
const invoiceFor=id=>db.invoices?.[id];
const invoiceMoney=value=>'ZMW '+value.toLocaleString('en-ZM',{minimumFractionDigits:2,maximumFractionDigits:2});
const canManageInvoices=()=>page==='finance'&&['Owner','Finance'].includes(role);
const invoiceFilters={from:'',to:'',status:'All statuses',query:''};
let invoiceTimer;
function withWorkspaceWrite(operation){
 if(navigator.locks)return navigator.locks.request(key,operation).catch(error=>notify(error.message));
 return operation();
}
function queueInvoice(sale){
 if(invoiceFor(sale.id))return;
 const settings=invoiceSettings();
 const cents=Math.round(sale.total*100);
 const taxCents=Math.round(cents*settings.rate/(10000+settings.rate));
 (db.invoices??={})[sale.id]={
   saleId:sale.id, reference:'SI-DEMO-'+sale.id, status:'Pending',
   dueAt:Date.now()+invoiceDelay, fail:settings.failNext, attempts:1,
   rate:settings.rate, net:(cents-taxCents)/100, tax:taxCents/100
 };
 if(settings.failNext)settings.failNext=false;
}
function scheduleInvoices(){
 clearTimeout(invoiceTimer);
 const pending=Object.values(db.invoices??{}).filter(invoice=>invoice.status==='Pending');
 if(!pending.length)return;
 const next=Math.min(...pending.map(invoice=>invoice.dueAt));
 invoiceTimer=setTimeout(()=>withWorkspaceWrite(()=>{
   refresh();
   let changed=false;
   for(const invoice of Object.values(db.invoices??{})){
     if(invoice.status!=='Pending'||invoice.dueAt>Date.now())continue;
     Object.assign(invoice,demoInvoiceAdapter.submit(invoice),{dueAt:0,fail:false});
     changed=true;
   }
   if(changed){save();updateInvoiceViews()}else scheduleInvoices();
 }),Math.max(0,next-Date.now()));
}
function retryInvoice(id){
 if(!canManageInvoices())return;
 const sale=db.sales.find(s=>s.id===id),invoice=invoiceFor(id);
 if(!sale||invoice?.status!=='Failed')return;
 Object.assign(invoice,{status:'Pending',dueAt:Date.now()+invoiceDelay,attempts:invoice.attempts+1,fail:false,error:''});
 save('Retried sample invoice '+invoice.reference,sale.branch);
 updateInvoiceViews();
 notify('Sample invoice queued for retry.');
}
function setInvoiceTax(){
 if(!canManageInvoices())return;
 form('Sample tax settings','<p class="sub">The sample rate is included in the existing selling price. Saved invoices retain their original tax breakdown.</p>'+
   field('Sample tax rate (%)','rate','type="number" min="0" max="100" step="0.01" required value="'+invoiceSettings().rate/100+'"'),'Save sample tax rate',x=>{
     if(!canManageInvoices())return 'Finance access is required.';
     const n=Number(x.rate);
     if(!coin(n)||n>100)return 'Enter a sample rate from 0% to 100%.';
     db.invoiceSettings={...invoiceSettings(),rate:Math.round(n*100)};
     done('Sample tax rate saved.');
   });
}
function toggleInvoiceFailure(){
 if(!canManageInvoices())return;
 const failNext=!invoiceSettings().failNext;
 db.invoiceSettings={...invoiceSettings(),failNext};
 save(failNext?'Armed a simulated invoice failure':'Cancelled the simulated invoice failure');
 updateInvoiceViews();
 notify(failNext?'The next completed sale will simulate an invoice failure.':'Simulated failure cancelled.');
}
function invoiceStatus(id,customerView){
 const invoice=invoiceFor(id);
 return '<div class="invoice-status-row"><strong>Payment · Paid</strong>'+
   (invoice?badge('Smart Invoice · '+invoice.status,invoice.status==='Issued'?'good':invoice.status==='Failed'?'bad':'warn'):'')+'</div>'+
   (!invoice?'<p class="small muted">This receipt has no sample invoice.</p>':
   invoice.status==='Failed'?'<p class="small muted">The submission failed. Authorised staff can retry it in Accounts.</p>':
   invoice.status==='Issued'?'<p class="small muted">'+esc(invoice.reference)+' · SAMPLE — DEMO ONLY</p><div class="actions">'+
     btn('Download Smart Invoice','invoice-pdf',id,'micro','download')+
     (customerView?'':btn('Print Smart Invoice','invoice-print',id,'micro'))+'</div>':'');
}
function invoiceStatusSlot(id,customerView=false){
 return `<section class="invoice-status no-print" data-invoice-sale="${esc(id)}" data-invoice-customer="${customerView}" aria-live="polite">${invoiceStatus(id,customerView)}</section>`;
}
function invoiceTable(){
 const term=invoiceFilters.query.trim().toLowerCase();
 const sales=db.sales.filter(s=>{
   const invoice=invoiceFor(s.id);
   return invoice&&matchBranch(s)&&(!invoiceFilters.from||s.date>=invoiceFilters.from)&&
     (!invoiceFilters.to||s.date<=invoiceFilters.to)&&
     (!term||[s.id,s.orderId,s.tradeInId,s.laybyId,invoice.reference].some(ref=>ref?.toLowerCase().includes(term)));
 });
 const counts=`<div class="invoice-counts">${['Issued','Pending','Failed'].map(state=>`<div><span>${state}</span><strong aria-label="${state} invoices">${sales.filter(s=>invoiceFor(s.id).status===state).length}</strong></div>`).join('')}</div>`;
 const rows=sales.filter(s=>invoiceFilters.status==='All statuses'||invoiceFor(s.id).status===invoiceFilters.status).map(s=>{
   const invoice=invoiceFor(s.id);
   return [pair(s.orderId||s.tradeInId||s.laybyId||s.id,s.date),esc(invoice.reference),esc(label(s.branch)),pair('Paid',s.method),
    badge(invoice.status,invoice.status==='Issued'?'good':invoice.status==='Failed'?'bad':'warn')+
      (invoice.error?`<br><small class="muted">${esc(invoice.error)}</small>`:''),
    money(s.total),`<div class="invoice-actions">${btn('Open sale','receipt',s.id,'micro')}${
      canManageInvoices()&&invoice.status==='Failed'?btn('Retry submission','retry-invoice',s.id,'micro'):''}</div>`];
 });
 return counts+table(['Order / sale','Invoice reference','Branch','Payment','Invoice status','Total',''],rows,
   'No sample invoices match this view. Invoices appear after a new sale is paid.');
}
function invoiceControls(){
 const settings=invoiceSettings();
 return `<p class="small muted">Current sample rate ${settings.rate/100}%, included in selling prices. Changes apply to future sales.</p><div class="invoice-actions">${btn('Set sample tax rate','invoice-tax','','micro')}${btn(settings.failNext?'Cancel simulated failure':'Fail next invoice submission','invoice-failure','','micro')}</div>`;
}
function invoicePanel(){

 return `<section class="panel pad invoice-panel" aria-labelledby="invoice-heading"><div class="panel-head"><h2 id="invoice-heading">ZRA Smart Invoice</h2>${badge('Demo mode','info')}</div>
   <p class="sub">Smart Invoice records sales and issues tax invoices. Tax filing and payment happen separately. The simulator sends no data to ZRA.</p>

   element.textContent=row;
   sheet.append(element);
 });

 // that suppress elements outside the modal top layer.
 (modal.open?modal:document.body).append(sheet);

 openDialog(title,`<div class="details">${body}</div><div class="form-actions">${buttons}</div>`);
}
function done(message,b=null,after){
 save(message,b);modal.close();render();notify(message);if(after)after();
}
function take(p,b,n,serials=[]){
 if(n>count(p,b))return null;
 if(typeof p.stock[b]==='number'){p.stock[b]-=n;return []}
 const selected=serials.length?serials:p.stock[b].slice(0,n);
 if(selected.length!==n||new Set(selected).size!==n||selected.some(s=>!p.stock[b].includes(s)))return null;
 p.stock[b]=p.stock[b].filter(s=>!selected.includes(s));
 return selected;
}
function restock(p,b,n,serials){
 if(typeof p.stock[b]==='number')p.stock[b]+=n;else p.stock[b].push(...serials);
}
function logSale(b,lines,customerName,channel,method,extras={}){
 if(method==='Cash'&&!extras.laybyId&&!shiftAt(b))throw Error('Open a till for this shop before recording cash.');
 const due=total(lines);
 const {commissionEmployee,...saleDetails}=extras;
 const sale={id:ref('R'),branch:b,date:today(),method,customer:customerName||'Walk-in customer',channel,lines,total:due,amount:due,...saleDetails};
 sale.shift=shiftAt(b)?.id;sale.by=actor();db.sales.unshift(sale);
 recordPayAttribution(sale,commissionEmployee);
 queueInvoice(sale);
 return sale;
}
function line(p,n,serials){return {id:p.id,name:p.name,price:p.price,cost:p.cost,units:n,serials}}
function paymentFields(){
 return methodField()+`<div id="mobile-fields" hidden>${phone('walletPhone',false)}<p class="sub">The demo shows a prompt on the simulated customer phone.</p></div><div id="cash-fields">${field('Cash received · optional','tender','type="number" min="0" max="10000000" step="0.01" placeholder="Exact amount if blank"')}</div>`;
}
const isMobile=method=>methods.slice(1,4).includes(method);
function showPaymentFields(){
 const method=modal.querySelector('[name="method"]')?.value;
 const mobile=modal.querySelector('#mobile-fields'),cash=modal.querySelector('#cash-fields');
 if(mobile){mobile.hidden=!isMobile(method);mobile.querySelector('input').required=!mobile.hidden;mobile.querySelector('input').disabled=mobile.hidden}
 if(cash){cash.hidden=method!=='Cash';cash.querySelector('input').disabled=cash.hidden}
}
function payment(x,due,complete){
 if(x.method==='Cash'&&x.tender&&(!coin(Number(x.tender))||Number(x.tender)<due))return 'Cash received must cover '+money(due)+'.';
 const change=x.method==='Cash'&&x.tender?round(Number(x.tender)-due):0;
 if(!isMobile(x.method))return complete(change);
 const last=val(x,'walletPhone').slice(-4);
 form('Simulated mobile money prompt',`<div class="info-box">Approve ${money(due)} through ${esc(x.method)} for the fictional number ending in ${esc(last)}. This demo collects no PIN and makes no charge.</div>`,'Simulate approval',()=>complete(0));
}
function checkout(){
 const items=cartItems(), b=sellingBranch;
 if(!items.length)return;
 const serialFields=items.filter(p=>typeof p.stock[b]!=='number').flatMap(p=>{
   const serials=p.stock[b];
   return Array.from({length:p.units},(_,index)=>select(esc(p.name)+' serial'+(p.units>1?' '+(index+1):''),'serial_'+p.id+'_'+index,opts(serials,serials[index])));
 }).join('');
 const discounts=ops().requests.filter(r=>r.type==='Price override'&&r.state==='Approved'&&r.branch===b&&items.some(p=>p.id===r.data.product&&p.units===1));
 form('Checkout · '+money(total(items)),(discounts.length?select('Approved single-unit discount','override',opts([['none','Standard price'],...discounts.map(r=>[r.id,r.id+' · '+money(r.data.price)])])):'')+`<p class="sub">Sale at ${label(b)}. All payment methods are simulated.</p>`+serialFields+customer(false)+select('Sales source','channel',opts(channels))+commissionEmployeeField()+paymentFields(),'Record payment',x=>{
   const lines=[];
   for(const cartItem of items){
     const p=product(cartItem.id);
     const serials=typeof p.stock[b]==='number'?[]:Array.from({length:cartItem.units},(_,i)=>x['serial_'+p.id+'_'+i]);
     if(cartItem.units>count(p,b)||new Set(serials).size!==serials.length||serials.some(s=>!p.stock[b].includes(s)))return 'Select a distinct available serial for each device.';
     lines.push(line(p,cartItem.units,serials));
   }
   const override=discounts.find(r=>r.id===x.override);if(override){const l=lines.find(l=>l.id===override.data.product);l.price=override.data.price}
   return payment(x,total(lines),change=>{
     if(override){const live=ops().requests.find(r=>r.id===override.id);if(live.state!=='Approved')return 'Discount already used.';live.state='Applied'}
     if(lines.some(l=>l.units>count(product(l.id),b)||l.serials.some(s=>!product(l.id).stock[b].includes(s))))return 'Stock changed. Close and reopen checkout.';
     for(const l of lines)take(product(l.id),b,l.units,l.serials);
     const sale=logSale(b,lines,val(x,'customer'),x.channel,x.method,{change,commissionEmployee:x.commissionEmployee});
     cart={};done('Sale recorded · '+sale.id,b,()=>showReceipt(sale.id));
   });
 });
 showPaymentFields();
}

function advanceOrder(id){
 const o=db.orders.find(x=>x.id===id),p=product(o.product);
 if(o.stage==='Ready'){
   form('Complete handover · '+money(o.price),commissionEmployeeField()+paymentFields(),'Record payment',x=>payment(x,o.price,change=>{
      const current=db.orders.find(q=>q.id===id);
      if(current.stage!=='Ready')return 'This order is no longer ready for handover.';
      const sale=logSale(o.branch,[{...line(product(o.product),1,current.serials),price:o.price}],o.customer,o.channel,x.method,{change,orderId:id,commissionEmployee:x.commissionEmployee});
      current.stage='Completed';current.receipt=sale.id;
      done('Order completed · '+id,o.branch,()=>showReceipt(sale.id));
   }));
   showPaymentFields();return;
 }
 if(o.stage==='Requested'){
   const serials=take(p,o.branch,1);
   if(serials===null){notify('No stock is available at this branch.');return}
   o.serials=serials;o.stage='Reserved';
 }else if(o.stage==='Reserved'){o.stage='Ready'}else{return}
 done(id+' · '+o.stage,o.branch,()=>showOrder(id));
}
function cancelOrder(id){
 form('Cancel '+id,'<p>Any reserved stock will be returned to the selected branch.</p>','Cancel order',()=>{
   const o=db.orders.find(x=>x.id===id);
   if(!orderStages[o.stage])return 'This order can no longer be cancelled.';
   if(o.stage!=='Requested')restock(product(o.product),o.branch,1,o.serials);
   o.stage='Cancelled';o.serials=[];done('Order cancelled · '+id,o.branch);
 });
}

function stockDialog(isTransfer){
 if(isTransfer)return transferRequest();
 form(isTransfer?'Transfer stock':'Receive stock',productsField()+branchField(isTransfer?'From branch':'Receiving branch')+
 (isTransfer?select('To branch','to',branchOpts(1-currentBranch())):'')+
 `<div id="stock-count">${field('Accessory quantity','quantity','type="number" min="1" max="999" step="1"')}</div>
 <div id="stock-serials">${field(isTransfer?'Serial to transfer':'New demo serial','serial','placeholder="SIM-DEMO-001" maxlength="40"')}</div>`,isTransfer?'Transfer unit(s)':'Receive stock',x=>{
   const p=product(x.product),b=Number(x.branch),to=Number(x.to),serial=val(x,'serial').toUpperCase(),serialized=typeof p.stock[b]!=='number';
   if(isTransfer&&b===to)return 'Choose different source and destination branches.';
   const n=serialized?1:Number(x.quantity);
   if(!qty(n)||n>999)return 'Enter a valid quantity from 1 to 999.';
   if(serialized&&!/^SIM-[A-Z0-9-]{3,36}$/.test(serial))return 'Use a fictional serial starting with SIM-.';
   if(isTransfer){
     const taken=take(p,b,n,serialized?[serial]:[]);
     if(taken===null)return 'That quantity or serial is unavailable at the source branch.';
     restock(p,to,n,taken);done('Transferred '+n+' · '+p.name+' · '+label(b)+' to '+label(to),to);
   }else{
     const exists=db.products.some(row=>row.stock.some(s=>Array.isArray(s)&&s.includes(serial)))||db.sales.some(s=>s.lines.some(l=>l.serials.includes(serial)))||[...db.orders,...db.plans].some(r=>r.serials.includes(serial));
     if(serialized&&exists)return 'That serial already exists in the demo.';
     restock(p,b,n,[serial]);done('Received '+n+' · '+p.name,b);
   }
 });
 showStockFields();
}
function showStockFields(){
 const countBox=modal.querySelector('#stock-count'),serialBox=modal.querySelector('#stock-serials');
 if(!countBox)return;
 const p=product(modal.querySelector('[name="product"]').value),asset=p.category!=='Accessories';
 countBox.hidden=asset;serialBox.hidden=!asset;

function pdf(name,rows,repeat=''){
 const encode=s=>Array.from(String(s).normalize('NFKD'),c=>{
   if(c==='—')return '\\227';
   if('\\()'.includes(c))return '\\'+c;
   return /^[\x20-\x7e]$/.test(c)?c:' ';
 }).join('');
 const chunks=rows.flatMap(s=>(String(s).match(/.{1,70}/g)||['']));
 const pages=[];
 for(let i=0;i<chunks.length;i+=43)pages.push([...(i&&repeat?[repeat,'']:[]),...chunks.slice(i,i+43)]);
 const kids=pages.map((_,i)=>(4+i*2)+' 0 R');
 const objects=[
   '<< /Type /Catalog /Pages 2 0 R >>',
   '<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>',
   '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'
 ];
 pages.forEach((rows,i)=>{
   const stream='BT /F 11 Tf 48 789 Td 17 TL '+rows.map((row,j)=>(j?'T* ':'')+'('+encode(row)+') Tj').join('\n')+' ET';
   objects.push(
     '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F 3 0 R >> >> /Contents '+(5+i*2)+' 0 R >>',
     '<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'
   );
 });
 let output='%PDF-1.4\n';const offsets=[0];
 objects.forEach((object,i)=>{offsets.push(output.length);output+=(i+1)+' 0 obj\n'+object+'\nendobj\n'});
 const xref=output.length;
 output+='xref\n0 '+offsets.length+'\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
 download(name+'.pdf',new Blob([output],{type:'application/pdf'}));
}

document.addEventListener('click',e=>{
 const button=e.target.closest('button[data-act]');

 if(blank){e.target.querySelector('.error').textContent='Complete the required fields.';blank.focus();return}

 withWorkspaceWrite(()=>{
   if(modal.querySelector('form')!==submittedForm)return;
   refresh();
   if(page!=='store'&&x.branch!==undefined&&!inScope(+x.branch)){submittedForm.querySelector('.error').textContent='Outside assigned branch.';return}
   if((x.date&&locked(x.date))&&(page==='finance'||page==='payroll')){submittedForm.querySelector('.error').textContent='Period locked. Submit a linked adjustment in the open period.';return}
   let error;try{error=activeSubmit?.(x)}catch(ex){refresh();error=ex.message}
